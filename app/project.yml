name: WidgetLab
options:
  bundleIdPrefix: com.widgetlab.app
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    COMPRESS_PNG_FILES: "NO"
targets:
  WidgetLab:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: App
        excludes:
          - PrivacyInfo.xcprivacy
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: WidgetLabWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WidgetLab
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "Select a Live Photo to use its motion in an animated widget."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.widgetlab.app
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
  WidgetLabWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: Widget/AnimationWidget.swift
      - path: Widget/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Fonts
        buildPhase: resources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: WidgetLabWidget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - WABlink2.ttf
          - WABlink3.ttf
          - WABlink4.ttf
          - WABlink5.ttf
          - WABlink6.ttf
          - WABlink10.ttf
          - WABlink12.ttf
          - WABlink15.ttf
          - WABlink20.ttf
          - WABlink30.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.widgetlab.app.widget
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
  WidgetLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Shared
      - path: App/Render
      - path: Tests
      - path: Resources/test.gif
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.widgetlab.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: ""
        BUNDLE_LOADER: ""
  WidgetLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: WidgetLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.widgetlab.app.uitests
        TEST_TARGET_NAME: WidgetLab
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  WidgetLabFlow:
    build:
      targets:
        WidgetLab: all
        WidgetLabUITests: [test]
    test:
      targets:
        - WidgetLabUITests
  WidgetLabHome:
    build:
      targets:
        WidgetLab: all
        WidgetLabUITests: [test]
    test:
      targets:
        - WidgetLabUITests
  WidgetLab:
    build:
      targets:
        WidgetLab: all
  WidgetLabTests:
    build:
      targets:
        WidgetLabTests: all
    test:
      targets:
        - WidgetLabTests
