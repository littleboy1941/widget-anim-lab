name: TestFlight

# Подписанная сборка (Apple Distribution + профили App Store) и загрузка в App Store Connect.
# Только вручную: секреты подписи есть только у владельца репозитория.
on:
  workflow_dispatch:

jobs:
  upload:
    if: github.repository == 'littleboy1941/widget-anim-lab'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM_ID: V6U3L6CJLA
      APP_PROFILE: WidgetLab AppStore
      WIDGET_PROFILE: WidgetLab Widget AppStore
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl -sL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen
          echo "$PWD/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Prepare project for App Store signing
        run: |
          cd app
          # Чужой персонаж в сборку для Apple не идёт — только наши тестовые GIF.
          rm -f Resources/monono*.gif
          ls Resources
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path("project.yml")
          text = project.read_text()

          def replace_once(old, new):
              global text
              assert text.count(old) == 1, old
              text = text.replace(old, new)

          replace_once('    CODE_SIGNING_ALLOWED: "NO"\n', '    CODE_SIGNING_ALLOWED: "YES"\n')
          replace_once('    CODE_SIGNING_REQUIRED: "NO"\n', '    CODE_SIGNING_REQUIRED: "YES"\n')
          replace_once('    CODE_SIGN_IDENTITY: ""\n', '    CODE_SIGN_IDENTITY: "Apple Distribution"\n')

          def signing(profile, extra=""):
              return (
                  "        CODE_SIGN_STYLE: Manual\n"
                  f"        DEVELOPMENT_TEAM: {os.environ['TEAM_ID']}\n"
                  f'        PROVISIONING_PROFILE_SPECIFIER: "{profile}"\n' + extra
              )

          app_id = "        PRODUCT_BUNDLE_IDENTIFIER: com.widgetlab.app\n"
          replace_once(app_id, app_id + signing(
              os.environ["APP_PROFILE"], "        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon\n"))
          widget_id = "        PRODUCT_BUNDLE_IDENTIFIER: com.widgetlab.app.widget\n"
          replace_once(widget_id, widget_id + signing(os.environ["WIDGET_PROFILE"]))

          resources = "      - path: Resources\n        buildPhase: resources\n"
          replace_once(resources, resources + "      - path: Store/Assets.xcassets\n")
          project.write_text(text)
          PY
          xcodegen generate

      - name: Install certificate and profiles
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          PROFILE_APP_BASE64: ${{ secrets.PROFILE_APP_BASE64 }}
          PROFILE_WIDGET_BASE64: ${{ secrets.PROFILE_WIDGET_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          rm "$RUNNER_TEMP/dist.p12"

          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            for b64 in "$PROFILE_APP_BASE64" "$PROFILE_WIDGET_BASE64"; do
              echo "$b64" | base64 --decode > "$RUNNER_TEMP/p.mobileprovision"
              uuid=$(security cms -D -i "$RUNNER_TEMP/p.mobileprovision" | plutil -extract UUID raw -)
              cp "$RUNNER_TEMP/p.mobileprovision" "$dir/$uuid.mobileprovision"
            done
          done
          ls "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Ensure iOS platform (actool for the app icon)
        run: xcrun simctl list runtimes | grep -q 'iOS' || xcodebuild -downloadPlatform iOS

      - name: Archive
        run: |
          cd app
          mkdir -p ci-out
          build_number="${{ github.run_number }}.${{ github.run_attempt }}"
          echo "Build number: $build_number"
          xcodebuild -project WidgetLab.xcodeproj -scheme WidgetLab -configuration Release \
            -destination 'generic/platform=iOS' -archivePath ci-out/WidgetLab.xcarchive \
            CURRENT_PROJECT_VERSION="$build_number" archive > ci-out/archive.log 2>&1 || {
              grep -E 'error:' ci-out/archive.log | head -60 || true
              tail -60 ci-out/archive.log
              exit 1
            }
          app=ci-out/WidgetLab.xcarchive/Products/Applications/WidgetLab.app
          codesign -dvv "$app" 2>&1 | grep -E 'Authority=Apple Distribution|TeamIdentifier'
          codesign -d --entitlements - "$app" 2>&1 | grep -A3 application-groups
          codesign -d --entitlements - "$app/PlugIns/WidgetLabWidget.appex" 2>&1 | grep -A3 application-groups
          plutil -p "$app/Info.plist" | grep -E 'CFBundleVersion|CFBundleShortVersionString|CFBundleIcons|CFBundleIconName'

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cd app
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$key"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.widgetlab.app</key><string>$APP_PROFILE</string>
              <key>com.widgetlab.app.widget</key><string>$WIDGET_PROFILE</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath ci-out/WidgetLab.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath ci-out/export \
            -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > ci-out/export.log 2>&1 || {
              tail -80 ci-out/export.log
              rm -f "$key"
              exit 1
            }
          rm -f "$key"
          tail -20 ci-out/export.log

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: |
            app/ci-out/archive.log
            app/ci-out/export.log
