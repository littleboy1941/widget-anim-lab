name: App on home screen

# Приложение целиком на домашнем экране симулятора iOS 26.5 (на iOS 27.0 виджеты
# заморожены — sim-check.yml): импорт тестовой гифки → публикация в App Group →
# виджет «Animated Widget» → видео. Подпись ad-hoc, чтобы работал App Group.
on:
  workflow_dispatch:

jobs:
  home:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: |
          curl -sL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen
          echo "$PWD/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate project
        run: cd app && xcodegen generate

      - name: Import, add widget, record
        run: |
          set +e   # ошибки не обрывают шаг: видео и журналы нужны и при провале
          cd app
          OUT="$PWD/ci-out/home"; mkdir -p "$OUT/crash"
          read -r RT DT < <(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rs = [r for r in json.load(sys.stdin)["runtimes"] if r["name"].startswith("iOS") and r["version"].startswith("26.") and r.get("isAvailable")]
          rs.sort(key=lambda r: [int(p) for p in r["version"].split(".")])
          r = rs[-1]
          ph = [d for d in r["supportedDeviceTypes"] if d["name"].startswith("iPhone") and "Pro" in d["name"]]
          print(r["identifier"], ph[-1]["identifier"])')
          DEV=$(xcrun simctl create WidgetLabHome "$DT" "$RT")
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b > /dev/null; sleep 10

          xcodebuild test -project WidgetLab.xcodeproj -scheme WidgetLabHome -destination "id=$DEV" \
            -derivedDataPath ci-out/home-build CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO \
            > "$OUT/uitest.log" 2>&1
          echo "UI-тест: код $?" | tee "$OUT/result.txt"
          grep -E "error:|Test Case|failed|passed" "$OUT/uitest.log" | tail -30

          xcrun simctl terminate "$DEV" com.widgetlab.app 2>/dev/null || true
          sleep 60   # заглушка сменяется живым виджетом
          xcrun simctl io "$DEV" screenshot "$OUT/home.png"
          xcrun simctl io "$DEV" recordVideo --codec=h264 --force "$OUT/home.mp4" > "$OUT/rec.txt" 2>&1 &
          REC=$!
          for _ in $(seq 1 20); do grep -q "Recording started" "$OUT/rec.txt" && break; sleep 0.5; done
          sleep 20
          kill -INT $REC; wait $REC; sleep 2

          # журнал диагностики из App Group и падения расширения
          GROUP=$(xcrun simctl get_app_container "$DEV" com.widgetlab.app groups 2>/dev/null | awk '/group.widgetlab.app/ {print $2}')
          echo "group container: $GROUP" | tee -a "$OUT/result.txt"
          [ -n "$GROUP" ] && { find "$GROUP" -maxdepth 3 | head -50 > "$OUT/group_tree.txt"; find "$GROUP" -name "*.jsonl" -exec cp {} "$OUT/" \; ; }
          find ~/Library/Logs/DiagnosticReports -name "*WidgetLab*" -exec cp {} "$OUT/crash/" \; 2>/dev/null
          ls "$OUT" "$OUT/crash"
          xcrun simctl shutdown "$DEV" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-home
          path: app/ci-out/home
