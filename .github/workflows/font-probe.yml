name: Font probe

# Прототип анимации на публичных API, сборка Xcode 26.6 (SDK 26.5):
# виджет на домашнем экране симулятора iOS 26.5, видео + IPA для телефона (SideStore).
on:
  push:
    branches: [main]
    paths-ignore: ['.gitignore', 'app/**', '.github/workflows/app.yml', 'gif_import/**', '.github/workflows/gif-import.yml', '.github/workflows/sim-check.yml', '.github/workflows/app-home.yml', '.github/workflows/app-flow.yml']
  workflow_dispatch:

jobs:
  probe:
    # На домашнем экране симулятора iOS 27 виджеты замороженные (не тикает даже системный
    # таймер), на iOS 26.5 — живые. Поэтому только macos-26; задания различаются тем,
    # что показывает первый виджет (Shared/Variant.swift). Все 10 режимов
    # присутствуют в каждом bundle; только первый переключается матрицей.
    strategy:
      fail-fast: false
      matrix:
        # Серия B: частота и перекрытие. Серия A: sbix и SVG-шрифты.
        mode: [fps8, fps12, fps16, fps24, fps30, fps24o0, fps30o0, fontA24, fontA30, fontA8svg]
    runs-on: macos-26
    env:
      SKIP_APP: "1"
      NO_ANALYZE: "1"
      PROBE_SWIFT_FLAGS: RATE_EXPERIMENTS
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Variant and frames
        run: |
          cd probe
          echo 'enum Variant { static let mode = "${{ matrix.mode }}" }' > Shared/Variant.swift
          cat Shared/Variant.swift
          python3 -m pip install --quiet --break-system-packages pillow fonttools
          python3 prepare_rate.py
          ls Fonts/WABlink2.ttf
          echo "Rate images: $(find RateFrames -name '*.png' | wc -l)"

      - name: Install XcodeGen
        run: |
          curl -sL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen
          echo "$PWD/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate project
        run: |
          xcodebuild -version
          cd probe && xcodegen generate

      - name: Build for simulator
        run: |
          cd probe
          xcodebuild -project FontProbe.xcodeproj -scheme FontProbe -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build_sim CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=RATE_EXPERIMENTS build > build_sim.log 2>&1 \
            || { grep -E "error:" build_sim.log | head -40; tail -40 build_sim.log; exit 1; }
          mkdir -p out
          cp -R build_sim/Build/Products/Release-iphonesimulator/FontProbe.app out/
          codesign -f -s - --deep out/FontProbe.app
          xcrun vtool -show-build out/FontProbe.app/FontProbe | grep -E "platform|sdk"

      - name: Build IPA for device
        if: matrix.mode == 'fps8'
        run: |
          cd probe
          xcodebuild -project FontProbe.xcodeproj -scheme FontProbe -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build_dev CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=RATE_EXPERIMENTS \
            build > build_dev.log 2>&1 \
            || { grep -E "error:" build_dev.log | head -40; tail -40 build_dev.log; exit 1; }
          mkdir -p Payload
          cp -R build_dev/Build/Products/Release-iphoneos/FontProbe.app Payload/
          find Payload -name "*.appex" -o -name "*.ttf" | head -50
          zip -qry FontProbe.ipa Payload

      - name: Ensure iOS simulator runtime
        run: xcrun simctl list runtimes | grep -q "iOS" || xcodebuild -downloadPlatform iOS

      - name: Run in simulator
        run: |
          MARKERS=$(cd probe && python3 -c '
          import colorsys
          n = 12
          print(";".join(",".join(str(round(v * 255)) for v in colorsys.hsv_to_rgb(k / n, 1, 1)) for k in range(n)))')
          echo "markers $MARKERS"
          bash probe/run.sh "$MARKERS"

      - name: Analyze numbered frames
        run: |
          python3 -m pip install --quiet --break-system-packages opencv-python-headless numpy
          video=$(find probe/out -name home_widget.mp4 -print -quit)
          case "${{ matrix.mode }}" in
            fontA24) frames=240 ;;
            fontA30) frames=120 ;;
            fontA8svg) frames=80 ;;
            fps24o0) frames=24 ;;
            fps30o0) frames=30 ;;
            fps*) frames=${{ matrix.mode }}; frames=${frames#fps} ;;
          esac
          # simctl recordVideo is variable-rate at up to about 60 samples/s.
          # At 30 fps it can miss whole animation frames between samples.
          cd probe
          python3 analyze_cells.py "${video#probe/}" \
            --cell "${{ matrix.mode }}:142,240,384,384:idx" \
            --frames "$frames" --start 2 --end 25 | tee out/rate_analysis.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: font-probe-${{ matrix.mode }}
          path: |
            probe/out/ios*
            probe/out/rate_analysis.txt
            probe/FontProbe.ipa
            probe/build_*.log
