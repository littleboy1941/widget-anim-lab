name: App user flow and widget animation

on:
  workflow_dispatch:

jobs:
  flow:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: |
          curl -sL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen
          echo "$PWD/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install video analysis dependencies
        run: python3 -m pip install opencv-python-headless numpy

      - name: Generate project
        run: cd app && xcodegen generate

      - name: Complete user flow, add widget, and check recording
        run: |
          set +e
          cd app
          OUT="$PWD/ci-out/flow"; mkdir -p "$OUT/crash"
          read -r RT DT < <(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rs = [r for r in json.load(sys.stdin)["runtimes"] if r["name"].startswith("iOS") and r["version"].startswith("26.5") and r.get("isAvailable")]
          r = rs[0]
          ph = [d for d in r["supportedDeviceTypes"] if d["name"].startswith("iPhone") and "Pro" in d["name"]]
          print(r["identifier"], ph[-1]["identifier"])')
          DEV=$(xcrun simctl create WidgetLabFlow "$DT" "$RT")
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b > /dev/null; sleep 10

          xcodebuild test -project WidgetLab.xcodeproj -scheme WidgetLabFlow -destination "id=$DEV" \
            -only-testing:WidgetLabUITests/FullFlowUITests/testUserFlowAndAddWidget \
            -parallel-testing-enabled NO -derivedDataPath ci-out/flow-build \
            -resultBundlePath "$OUT/FullFlow.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO \
            > "$OUT/uitest.log" 2>&1
          TEST_STATUS=$?
          echo "UI test exit code: $TEST_STATUS" | tee "$OUT/result.txt"
          grep -E "error:|Test Case|failed|passed" "$OUT/uitest.log" | tail -30

          xcrun simctl terminate "$DEV" com.widgetlab.app 2>/dev/null || true
          sleep 60
          xcrun simctl io "$DEV" screenshot "$OUT/home.png"
          xcrun simctl io "$DEV" recordVideo --codec=h264 --force "$OUT/home.mp4" > "$OUT/rec.txt" 2>&1 &
          REC=$!
          for _ in $(seq 1 20); do grep -q "Recording started" "$OUT/rec.txt" && break; sleep 0.5; done
          sleep 20
          kill -INT $REC; wait $REC; sleep 2

          python3 tools/check_widget_video.py "$OUT/home.mp4" | tee "$OUT/video-check.txt"
          VIDEO_STATUS=${PIPESTATUS[0]}

          GROUP=$(xcrun simctl get_app_container "$DEV" com.widgetlab.app groups 2>/dev/null | awk '/group.widgetlab.app/ {print $2}')
          echo "group container: $GROUP" | tee -a "$OUT/result.txt"
          [ -n "$GROUP" ] && { find "$GROUP" -maxdepth 4 | head -80 > "$OUT/group_tree.txt"; find "$GROUP" -name "*.jsonl" -exec cp {} "$OUT/" \; ; }
          [ -n "$GROUP" ] && find "$GROUP" -name "manifest.json" -exec cp {} "$OUT/" \; -exec cat {} \;
          find ~/Library/Logs/DiagnosticReports -name "*WidgetLab*" -exec cp {} "$OUT/crash/" \; 2>/dev/null
          xcrun simctl shutdown "$DEV" || true

          if [ "$TEST_STATUS" -eq 0 ] && [ "$VIDEO_STATUS" -eq 0 ]; then
            echo "RESULT PASS ui_test=0 video=0" | tee -a "$OUT/result.txt"
          else
            echo "RESULT FAIL ui_test=$TEST_STATUS video=$VIDEO_STATUS" | tee -a "$OUT/result.txt"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-flow
          path: app/ci-out/flow
