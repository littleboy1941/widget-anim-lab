name: App core

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: |
          curl -sL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen
          echo "$PWD/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate project
        run: |
          xcodebuild -version
          cd app
          xcodegen generate

      - name: Build app and widget for simulator
        run: |
          cd app
          mkdir -p ci-out
          xcodebuild -project WidgetLab.xcodeproj -scheme WidgetLab -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ci-out/build CODE_SIGNING_ALLOWED=NO build \
            > ci-out/build.log 2>&1 || {
              grep -E 'error:' ci-out/build.log | head -60 || true
              tail -60 ci-out/build.log
              exit 1
            }
          tail -15 ci-out/build.log

      - name: Build IPA for device (unsigned, SideStore re-signs)
        run: |
          cd app
          xcodebuild -project WidgetLab.xcodeproj -scheme WidgetLab -configuration Release             -sdk iphoneos -destination 'generic/platform=iOS'             -derivedDataPath ci-out/build-dev CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             build > ci-out/build-dev.log 2>&1 || {
              grep -E 'error:' ci-out/build-dev.log | head -60 || true
              tail -60 ci-out/build-dev.log
              exit 1
            }
          rm -rf Payload && mkdir Payload
          cp -R ci-out/build-dev/Build/Products/Release-iphoneos/WidgetLab.app Payload/
          find Payload -name "*.appex" -o -name "*.gif" -o -name "WABlink*.ttf" | head -20
          zip -qry ci-out/WidgetLab.ipa Payload
          ls -la ci-out/WidgetLab.ipa

      - name: Ensure iOS simulator runtime
        run: xcrun simctl list runtimes | grep -q 'iOS' || xcodebuild -downloadPlatform iOS

      - name: Run hostless tests on iOS 26.5 simulator
        run: |
          cd app
          read -r runtime device_type < <(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)["runtimes"]
                      if r["name"].startswith("iOS") and r.get("isAvailable")]
          preferred = [r for r in runtimes if r["version"] == "26.5"]
          if not preferred:
              raise SystemExit("iOS 26.5 simulator runtime is required")
          runtime = preferred[-1]
          phones = [d for d in runtime.get("supportedDeviceTypes", [])
                    if d["name"].startswith("iPhone") and "Pro" in d["name"]]
          if not phones:
              raise SystemExit("No supported iPhone Pro simulator")
          print(runtime["identifier"], phones[-1]["identifier"])
          ')
          simulator=$(xcrun simctl create WidgetLab-CI "$device_type" "$runtime")
          trap 'xcrun simctl shutdown "$simulator" 2>/dev/null || true; xcrun simctl delete "$simulator" 2>/dev/null || true' EXIT
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
          xcodebuild -project WidgetLab.xcodeproj -scheme WidgetLabTests -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator" \
            -derivedDataPath ci-out/test-build -resultBundlePath ci-out/test.xcresult \
            CODE_SIGNING_ALLOWED=NO test > ci-out/test.log 2>&1 || {
              grep -E 'error:|Test Case.*failed|failed -' ci-out/test.log | head -80 || true
              tail -80 ci-out/test.log
              exit 1
            }
          grep -E 'Test Case|Executed|TEST SUCCEEDED' ci-out/test.log | tail -40 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-build-and-test
          path: |
            app/ci-out/build.log
            app/ci-out/test.log
            app/ci-out/test.xcresult
            app/ci-out/build-dev.log
            app/ci-out/WidgetLab.ipa
