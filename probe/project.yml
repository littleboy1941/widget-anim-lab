# Прототип анимации виджета на публичных API (см. fontgen.py, Shared/TimerAnimation.swift).
# Собирается в облаке: .github/workflows/font-probe.yml.
name: FontProbe
options:
  bundleIdPrefix: com.widgetlab.fontprobe
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    # пиксель-арт кладём как есть, без переупаковки PNG
    COMPRESS_PNG_FILES: "NO"
    STRIP_PNG_TEXT: "NO"
targets:
  FontProbe:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Fonts
      - path: Frames
      # кадры для проверки длины анимации, генерирует CI (make_frames.py)
      - path: LenFrames
        optional: true
      - path: SmallFrames
        optional: true
      - path: SlowFrames
        optional: true
      - path: RateFrames
        optional: true
      - path: CapacityFrames
        optional: true
      - path: DeepFrames
        optional: true
      # кадры для замера памяти (CI, make_frames.py)
      - path: MemFrames
        optional: true
    dependencies:
      - target: FontProbeWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FontProbe
        UILaunchScreen: {}
        UIAppFonts:
          - WABlink2.ttf
          - WABlink3.ttf
          - WABlink5.ttf
          - WABlink10.ttf
          - WABlink20.ttf
          - WABlink30.ttf
