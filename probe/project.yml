        optional: true
      - path: SlowFrames
        optional: true
      - path: RateFrames
        optional: true
      - path: CapacityFrames
        optional: true
      - path: DeepFrames
        optional: true
      # кадры для замера памяти (CI, make_frames.py)
      - path: MemFrames
        optional: true
